<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Playwright E2E Test Results</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f0f2f5; color: #1a1a2e; padding: 2rem; }
    .container { max-width: 960px; margin: 0 auto; }
    h1 { font-size: 1.8rem; margin-bottom: 1.5rem; color: #16213e; }
    .summary { display: grid; grid-template-columns: repeat(4, 1fr); gap: 1rem; margin-bottom: 2rem; }
    .stat { background: #fff; border-radius: 12px; padding: 1.2rem; text-align: center; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    .stat .number { font-size: 2rem; font-weight: 700; }
    .stat .label { font-size: 0.85rem; color: #666; margin-top: 0.3rem; }
    .stat.passed .number { color: #2ecc71; }
    .stat.failed .number { color: #e74c3c; }
    .stat.skipped .number { color: #f39c12; }
    .stat.total .number { color: #3498db; }
    table { width: 100%; border-collapse: collapse; background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 2px 8px rgba(0,0,0,0.06); }
    th { background: #16213e; color: #fff; padding: 0.8rem 1rem; text-align: left; font-weight: 600; }
    td { padding: 0.7rem 1rem; border-bottom: 1px solid #eee; font-size: 0.9rem; }
    tr:last-child td { border-bottom: none; }
    tr:hover { background: #f8f9fa; }
    .badge { display: inline-block; padding: 2px 10px; border-radius: 20px; font-size: 0.75rem; font-weight: 600; }
    .badge-passed { background: #d4edda; color: #155724; }
    .badge-failed { background: #f8d7da; color: #721c24; }
    .badge-skipped { background: #fff3cd; color: #856404; }
    .duration { color: #888; font-size: 0.85rem; }
  </style>
</head>
<body>
  <div class="container">
    <h1>Playwright E2E Test Results</h1>
    <div class="summary" id="summary"></div>
    <table>

      </thead>
      <tbody id="results"></tbody>
    </table>
  </div>

  </script>
</body>
</html>
